[package]
name = "merlin-rustdesk-client"
version = "0.4.2"
edition = "2021"
license = "AGPL-3.0-only"
description = "Client di assistenza remota Merlin-RustDesk"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Nucleo RustDesk (questo repository), con l'API per il client Merlin.
rustdesk = { path = "../..", features = ["merlin"] }
tauri-plugin-dialog = "2"
minisign-verify = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
# Controllo e installazione automatica di WebView2 (src/webview2.rs).
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
