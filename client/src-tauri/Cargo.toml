[package]
name = "merlin-rustdesk-client"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Client di assistenza remota Merlin-RustDesk"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Nucleo RustDesk (questo repository), con l'API per il client Merlin.
rustdesk = { path = "../..", features = ["merlin"] }
